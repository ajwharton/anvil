[project]
name = "anvil-train"
version = "0.0.2"
description = "Open-source post-training: SFT/RL, LoRA-first, live RL observability & probes, web control plane"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Anvil contributors" }]
keywords = [
  "post-training",
  "sft",
  "reinforcement-learning",
  "rl",
  "grpo",
  "ppo",
  "lora",
  "peft",
  "vllm",
  "observability",
  "rl-debugger",
  "fine-tuning",
  "llm",
  "vision",
  "jetson",
  "edge-ai",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.0"]
serve = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
hf = ["transformers>=4.44", "jinja2>=3.1", "pillow>=10.0"]
local = ["torch>=2.4", "transformers>=4.44", "peft>=0.12"]
mcp = ["mcp>=1.2"]

[project.scripts]
anvil = "anvil.cli:main"
anvil-web = "anvil.web.__main__:main"
anvil-mcp = "anvil.agent.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["anvil*"]

[tool.setuptools.package-data]
anvil = ["web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# importorskip guards must precede anvil imports for optional deps
"tests/test_hf_renderer.py" = ["E402"]
"tests/test_local_backend.py" = ["E402"]
"tests/test_local_vlm_modality.py" = ["E402"]
