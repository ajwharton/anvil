name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          # Core CI: no torch/peft (GPU extras). LocalBackend tests importorskip.
          pip install -e ".[dev,web]"
      - name: Pytest
        run: pytest -q --tb=short
      - name: Ruff
        run: ruff check anvil tests scripts
